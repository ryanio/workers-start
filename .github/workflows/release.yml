name: Release

# Publishes to npm when a version tag is pushed. npm trusts this workflow
# through OIDC (trusted publishing), so there is no npm token, and the
# registry adds a provenance statement to every version it accepts.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish unless this version is already on npm
        run: |
          version=$(node -p 'require("./package.json").version')
          if npm view "workers-start@$version" version >/dev/null 2>&1; then
            echo "workers-start@$version is already published"
          else
            npm publish
          fi
